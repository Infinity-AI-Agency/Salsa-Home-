<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#16110e"><title>LUMI ROOM | Mi Sala</title>
<style>
:root{--gold:#f1c17c;--gold2:#dba85d;--edge:rgba(252,207,151,.23);--bg:#18130f;--dim:#a99e92}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#100e0d;color:#f8f3ed;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid #f6cf93;outline-offset:3px}.app{max-width:1086px;margin:auto;position:relative;box-shadow:0 0 80px #000a;min-height:100vh;background:var(--bg)}
.header{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,rgba(26,20,17,.98),rgba(25,19,16,.95));backdrop-filter:blur(20px);padding:18px clamp(16px,4vw,40px) 16px;border-bottom:1px solid #76614b;box-shadow:0 9px 35px #0008}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.brand{display:flex;align-items:center;gap:18px;min-width:0}.logo{font-size:clamp(25px,5.5vw,46px);line-height:1;letter-spacing:.21em;font-weight:300;color:#f1c88b}.tag{font-size:8px;letter-spacing:.32em;color:#dfba82;margin-top:5px}.vline{height:41px;border-left:1px solid #8a735d}.roomtitle{font-size:clamp(19px,3vw,30px);font-weight:600}.subtitle{font-size:clamp(11px,2vw,15px);color:#aaa09a;margin-top:3px}.status{white-space:nowrap;font-size:12px;color:#c7bdb2;display:flex;align-items:center;gap:7px}.dot{height:8px;width:8px;border-radius:50%;background:#5cdfa0;box-shadow:0 0 12px #47ff9d}.toolbar{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.toolbar::-webkit-scrollbar{display:none}.scene,.alloff{border-radius:999px;padding:12px 16px;min-height:46px;border:1px solid rgba(244,222,189,.26);background:#241c18;color:#f3ece5;white-space:nowrap;min-width:90px;transition:background .2s,border-color .2s,transform .2s}.scene:hover,.alloff:hover{transform:translateY(-1px)}.scene.active{border-color:var(--gold);background:linear-gradient(115deg,#5f4024,#281d14);box-shadow:inset 0 0 0 1px #f1c17c55;color:#ffe0aa}.alloff{background:linear-gradient(120deg,#ffe7b8,#dfab63);color:#24160c;font-weight:800;border:none;min-width:145px}.alloff.off{background:#39312b;color:#ecd6b5;border:1px solid #a58054}.sep{border-left:1px solid #675747;margin:7px 3px;flex:0 0 1px}.scene{flex:1}
.visual{position:relative;isolation:isolate;background:#31271e;line-height:0;overflow:hidden}.room-photo{width:100%;height:auto;display:block}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0002,transparent 24%,transparent 64%,#0003);pointer-events:none;z-index:1}.night-mask{position:absolute;inset:0;background:#080b18;opacity:0;mix-blend-mode:multiply;z-index:2;pointer-events:none;transition:opacity .5s}.glow{position:absolute;z-index:3;pointer-events:none;opacity:.7;transition:opacity .4s;filter:blur(18px);mix-blend-mode:screen}.glow[data-glow="ceiling"]{left:27%;top:4%;width:49%;height:22%;background:radial-gradient(ellipse,#ffd48d88 0%,transparent 70%)}.glow[data-glow="shelves"]{left:0;top:18%;width:50%;height:29%;background:radial-gradient(ellipse,#ffc56b9a,transparent 72%)}.glow[data-glow="tv"]{left:24%;top:27%;width:57%;height:27%;background:radial-gradient(ellipse,#ffc77d9a,transparent 74%)}.glow[data-glow="wall"]{right:0;top:4%;width:28%;height:43%;background:radial-gradient(ellipse,#ffc47a83,transparent 70%)}.glow[data-glow="floor"]{right:0;bottom:9%;width:41%;height:43%;background:radial-gradient(ellipse,#ffb75b80,transparent 70%)}
.hotspot{position:absolute;z-index:5;display:flex;align-items:center;gap:7px;border:0;padding:0;background:transparent;color:white;white-space:nowrap;line-height:1.1;filter:drop-shadow(0 2px 5px #0008);transform:translate(-5%,-50%)}.hotspot .orb{display:block;position:relative;flex:0 0 27px;height:27px;border-radius:50%;background:#ffefd4;border:3px solid #fff2d6;box-shadow:0 0 0 10px #f7bd6b44,0 0 24px 9px #ffb95cbb;transition:all .25s}.hotspot.inactive .orb{background:#6f6964;border-color:#a59b8b;box-shadow:0 0 0 8px #1117}.hotspot .pill{font-size:clamp(10px,1.85vw,14px);background:rgba(27,19,13,.85);border:1px solid #c9a16d7a;border-radius:999px;padding:12px 15px;backdrop-filter:blur(10px)}.hotspot.selected .pill{border-color:#ffdb9e;box-shadow:0 0 0 2px #ffc56c40}.hotspot[data-zone="ceiling"]{top:13%;left:51%}.hotspot[data-zone="wall"]{top:21%;left:79%}.hotspot[data-zone="shelves"]{top:38%;left:14%}.hotspot[data-zone="tv"]{top:47%;left:59%}.hotspot[data-zone="floor"]{top:77%;left:79%}
.controls{position:relative;z-index:10;background:linear-gradient(145deg,#211a16,#100f10);border-top:1px solid #a9875b73;padding:22px clamp(16px,3vw,35px) 27px;box-shadow:0 -12px 35px #0005}.panelheading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.panelheading h2{margin:0;font-weight:500;font-size:18px}.hint{font-size:12px;color:#ab9d8d}.devices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.device{background:linear-gradient(145deg,#201915,#261b16);border:1px solid var(--edge);border-radius:16px;padding:14px 12px;min-width:0;transition:border-color .2s}.device:focus-within{border-color:#eaba7d}.device-name{display:block;font-size:13px;font-weight:600;min-height:36px}.switch{width:55px;height:30px;border-radius:20px;background:#5d5149;border:none;padding:3px;display:flex;align-items:center;transition:background .2s;margin:6px 0 14px}.switch:before{content:"";display:block;width:24px;height:24px;border-radius:50%;background:white;transition:transform .2s;box-shadow:0 2px 5px #0004}.switch.on{background:linear-gradient(90deg,#dfab66,#f4cc91)}.switch.on:before{transform:translateX(25px)}.range{width:100%;accent-color:#efbc78;cursor:pointer}.level{font-size:11px;color:#c8a77d;margin-top:5px;display:block}.footer{border-top:1px solid #4f3c2d;padding:19px;text-align:center;font-size:11px;color:#9e8c7a;letter-spacing:.05em}.footer strong{color:#e1bb85;font-weight:600}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:50;border:1px solid #bc8b53;background:#231b16ec;border-radius:30px;padding:12px 18px;font-size:13px;transition:.25s;white-space:nowrap;box-shadow:0 8px 30px #0007}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.header{padding:13px 12px 12px}.top{margin-bottom:12px}.brand{gap:10px}.vline{height:35px}.logo{letter-spacing:.16em}.status{font-size:10px}.toolbar{gap:7px}.alloff{min-width:124px}.scene,.alloff{padding:11px 13px;min-height:42px;font-size:12px;min-width:78px}.devices{grid-template-columns:repeat(2,minmax(0,1fr))}.device-name{min-height:auto}.hotspot .pill{padding:8px 10px;font-size:10px}.hotspot .orb{flex-basis:15px;height:15px;border-width:2px;box-shadow:0 0 0 6px #f7bd6b44,0 0 13px 5px #ffb95c99}.hotspot{gap:5px}.hotspot[data-zone="wall"]{left:76%}.hotspot[data-zone="floor"]{left:75%}.hint{font-size:10px}}@media(max-width:390px){.tag{font-size:6px}.roomtitle{font-size:17px}.subtitle{font-size:10px}.status{font-size:9px}.hotspot[data-zone="shelves"]{left:6%}.hotspot[data-zone="tv"]{left:54%}.hotspot[data-zone="wall"]{left:70%}.hotspot[data-zone="floor"]{left:69%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<section class="controls" aria-label="Control individual de luces"><div class="panelheading"><h2>Iluminación de tu sala</h2><span class="hint">Toca una zona para encenderla</span></div><div class="devices" id="devices"></div></section><footer class="footer">Diseñado para <strong>LUMI Smart Living</strong> · Una creación de <strong>Infinity AI Lab</strong><div style="margin-top:6px">Demo de simulación: aún no conectado a dispositivos físicos</div></footer></main><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const defs=[{id:'ceiling',name:'Techo'},{id:'shelves',name:'Repisas'},{id:'tv',name:'Detrás TV'},{id:'wall',name:'Spots pared'},{id:'floor',name:'Luz inferior'}];
const presets={relax:{ceiling:65,shelves:85,tv:70,wall:55,floor:65},cine:{ceiling:0,shelves:0,tv:65,wall:0,floor:25},lectura:{ceiling:100,shelves:70,tv:25,wall:85,floor:50},noche:{ceiling:0,shelves:20,tv:0,wall:0,floor:20}};
let lights={...presets.relax};try{const saved=JSON.parse(localStorage.getItem('lumi-room-v2'));if(saved&&typeof saved==='object')for(const d of defs){if(Number.isFinite(saved[d.id]))lights[d.id]=Math.max(0,Math.min(100,saved[d.id]));}}catch(e){}
const devices=document.getElementById('devices'),master=document.getElementById('master'),mask=document.getElementById('nightmask');let toastTime;
function announce(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTime);toastTime=setTimeout(()=>el.classList.remove('show'),1700)}
function save(){try{localStorage.setItem('lumi-room-v2',JSON.stringify(lights))}catch(e){}}
function render(){for(const d of defs){const val=lights[d.id];const btn=document.querySelector('.hotspot[data-zone="'+d.id+'"]');btn.classList.toggle('inactive',val===0);btn.setAttribute('aria-label',d.name+', '+(val?'encendido '+val+'%':'apagado')+'. Toca para cambiar');btn.setAttribute('aria-pressed',String(val>0));const glow=document.querySelector('.glow[data-glow="'+d.id+'"]');glow.style.opacity=val/100*.98;const sw=document.querySelector('.switch[data-switch="'+d.id+'"]');sw.classList.toggle('on',val>0);sw.setAttribute('aria-pressed',String(val>0));sw.setAttribute('aria-label',(val?'Apagar ':'Encender ')+d.name);const slider=document.querySelector('.range[data-range="'+d.id+'"]');slider.value=val;slider.setAttribute('aria-label','Intensidad de '+d.name);document.querySelector('[data-level="'+d.id+'"]').textContent=val+'%';}const alloff=defs.every(d=>lights[d.id]===0);master.textContent=alloff?'ENCENDER TODO':'APAGAR TODO';master.classList.toggle('off',alloff);mask.style.opacity=alloff?'.70':String(.35-(Object.values(lights).reduce((a,b)=>a+b,0)/500)*.30);for(const btn of document.querySelectorAll('.scene')){const p=presets[btn.dataset.scene];btn.classList.toggle('active',defs.every(d=>p[d.id]===lights[d.id]));}save()}
for(const d of defs){let c=document.createElement('div');c.className='device';c.innerHTML='<span class="device-name">'+d.name+'</span><button class="switch" type="button" data-switch="'+d.id+'"></button><input class="range" type="range" min="0" max="100" step="5" data-range="'+d.id+'"><span class="level" data-level="'+d.id+'"></span>';devices.appendChild(c)}
function toggle(id){lights[id]=lights[id]?0:75;render()}
for(const h of document.querySelectorAll('.hotspot'))h.addEventListener('click',()=>{toggle(h.dataset.zone);h.classList.add('selected');setTimeout(()=>h.classList.remove('selected'),450)});
for(const b of document.querySelectorAll('.switch'))b.addEventListener('click',()=>toggle(b.dataset.switch));
for(const r of document.querySelectorAll('.range'))r.addEventListener('input',()=>{lights[r.dataset.range]=Number(r.value);render()});
for(const b of document.querySelectorAll('.scene'))b.addEventListener('click',()=>{lights={...presets[b.dataset.scene]};render();announce('Escena '+b.textContent+' activada')});
master.addEventListener('click',()=>{const off=defs.every(d=>lights[d.id]===0);lights=off?{...presets.relax}:Object.fromEntries(defs.map(d=>[d.id,0]));render();announce(off?'Iluminación encendida':'Todas las luces apagadas')});render();
</script></body></html>
